name: SRK Business Manager - Cloud Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srk-business-manager-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=srk_business_manager .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: SRK-Business-Manager-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows Release Package
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --project-name=srk_business_manager .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Windows application
        run: flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release/SRK Business Manager.exe")) {
            throw "Expected Windows application executable was not found."
          }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/SRK-Business-Manager-Windows-x64.zip" -Force

      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: SRK-Business-Manager-Windows-x64
          path: build/SRK-Business-Manager-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
